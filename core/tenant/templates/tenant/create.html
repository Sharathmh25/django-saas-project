{% extends "account/base.html" %}

{% block title %}Create Tenant{% endblock %}

{% block content %}
<h2>Create / Update Company</h2>

{% if messages %}
    {% for message in messages %}
        <p style="color: green;">{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="POST">
    {% csrf_token %}
    
    {{ form.as_p }}

    <button type="submit">Submit</button>
</form>

<a href="{% url 'tenant_detail' %}">View Company</a>

{% endblock %}
